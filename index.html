<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        background-color: #f0f4f8;
        font-family: Arial, sans-serif;
        text-align: center;
        padding-top: 50px;
      }

      h1 {
        color: #2c3e50;
        font-size: 32px;
      }

      p {
        color: #7f8c8d;
        font-size: 18px;
      }

      button {
        background-color: #3498db;
        color: white;
        border: none;
        padding: 12px 24px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>

    <h1>Hello Students!</h1>
    <p>My First Web Page</p>
    
    <!-- ضفنا هنا حدث onclick للزرار -->
    <button onclick="showMessage()">Click Me</button>

    <!-- كود الجافا سكريبت -->
    <script>
      function showMessage() {
        alert("أهلاً بك! لقد قمت بالضغط على الزر بنجاح 🚀");
      }
    </script>

  </body>
</html>
